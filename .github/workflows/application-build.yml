name: Application build checks

on:
  push:
    branches: [main, "maintenance/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build Next.js application
        env:
          NEXT_PUBLIC_BACKEND_URL: https://api.sinkthatship.com
        run: npm run build

  backend-check:
    name: Backend install and syntax checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sinkthatship
        run: npx prisma generate
      - name: Check backend JavaScript syntax
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
