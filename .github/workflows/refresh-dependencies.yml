name: Refresh vulnerable dependency locks

on:
  push:
    branches: ["maintenance/sendgrid-security"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh frontend dependencies
        working-directory: frontend
        run: |
          npm install
          npm audit fix || true
      - name: Refresh backend dependencies
        working-directory: backend
        run: |
          npm install
          npm audit fix || true
      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh dependency lockfiles"
            git push
          fi
      - name: Verify dependency audit
        run: |
          (cd frontend && npm audit --audit-level=high)
          (cd backend && npm audit --audit-level=high)

# Keep this workflow on the maintenance branch to refresh and audit both lockfiles.
